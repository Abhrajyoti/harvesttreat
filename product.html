<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product details, nutrition and ordering information from Harvest Treats.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#183f35">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="product.css">
  <title>Product details | Harvest Treats</title>
</head>
<body>
  <header class="site-header product-header">
    <div class="utility-bar"><p class="utility-message">Freshly packed pantry favourites • Free delivery above ₹499</p></div>
    <nav class="main-nav" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Harvest Treats home"><img src="Logo.jpeg" alt="Harvest Treats Logo" width="300" height="200"></a>
      <div class="nav-links"><a href="index.html#products">Shop all</a><a href="index.html#our-promise">Our promise</a><a href="index.html#contact">Contact</a></div>
      <button class="cart-button" type="button" id="cartButton" aria-controls="cartPanel" aria-label="Open shopping bag"><span aria-hidden="true">Bag</span><strong id="cartCount">0</strong></button>
    </nav>
  </header>
  <main id="productPage"></main>
  <aside class="cart-panel" id="cartPanel" aria-labelledby="cartTitle" aria-hidden="true">
    <div class="cart-header"><h2 id="cartTitle">Your bag</h2><button type="button" id="closeCart">Close</button></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-total"><span>Estimated listed total</span><strong id="cartTotal">Rs. 0</strong></div>
    <p class="delivery-note">Assured delivery support • Free delivery on orders above ₹499</p>
    <button class="primary-button whatsapp-order" type="button" id="orderButton">Order via WhatsApp</button>
    <p class="cart-note">We confirm final availability and delivery details with you on WhatsApp.</p>
  </aside>
  <script src="product-data.js"></script>
  <script src="product-detail.js"></script>
</body>
</html>
